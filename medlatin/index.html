<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f5f7f5"><title>MedLatin — тренажёр</title>
<style>
:root{--bg:#f5f7f5;--ink:#183b38;--muted:#5b716d;--accent:#176b5e;--line:#dce6e1;--white:#fff;--soft:#e4f2ed;--gold:#b57520;--red:#9f4141}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button,select{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer;border:0}button:focus-visible,select:focus-visible{outline:3px solid #bf8b35;outline-offset:2px}button:disabled{opacity:.4;cursor:default}main{max-width:560px;margin:auto;padding: max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin:0 0 20px}.brand{font-size:24px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--accent)}.eyebrow{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}.homebtn{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:650}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px #183b3807}h1{font-size:30px;line-height:1.13;letter-spacing:-1px;margin:7px 0 12px}h2{font-size:23px;line-height:1.2;letter-spacing:-.4px;margin:4px 0 8px}p{margin:6px 0 14px}.muted{color:var(--muted);font-size:14px}.primary,.secondary{display:block;width:100%;min-height:52px;border-radius:15px;padding:12px 16px;font-weight:750;text-align:center}.primary{background:var(--accent);color:white}.secondary{background:white;border:1px solid var(--line)}.row{display:flex;gap:10px}.row>*{flex:1}.section{display:flex;gap:8px;margin:12px 0 20px}.section button{flex:1;background:white;border:1px solid var(--line);border-radius:13px;min-height:48px;font-weight:700}.section button.active{background:var(--accent);color:white;border-color:var(--accent)}.field{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:12px 0 6px}select{width:100%;padding:12px;border:1px solid var(--line);background:white;border-radius:12px;min-height:48px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 16px}.step{font-size:11px;font-weight:700;padding:10px 4px;text-align:center;color:var(--muted);border-bottom:3px solid var(--line)}.step.active{color:var(--accent);border-color:var(--accent)}.step.done{color:var(--accent);border-color:#93c5b5}.step strong{display:block;font-size:17px}.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:9px 0 15px}.bar div{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.flash{width:100%;border:1px solid #cde3da;min-height:245px;background:var(--soft);border-radius:22px;padding:24px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;margin:14px 0 12px;color:var(--ink)}.flash.flipped{background:#fff4e3;border-color:#ecd9b9}.term{font-size:clamp(24px,7vw,37px);line-height:1.15;font-weight:780;overflow-wrap:anywhere}.hint{font-size:13px;color:var(--muted)}.subterm{font-size:15px;color:var(--muted)}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.matchcol{display:flex;flex-direction:column;gap:9px;min-width:0}.matchhead{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:center;font-weight:750}.match{border:1px solid var(--line);background:#fff;min-height:66px;padding:9px 6px;border-radius:13px;font-weight:650;font-size:clamp(12px,3.6vw,15px);overflow-wrap:anywhere;line-height:1.25}.match.selected{background:#e4f2ed;border:2px solid var(--accent);padding:8px 5px}.match.matched{background:#e9f4ec;color:#46745a;border-color:#b8d9c3;opacity:.8}.match.wrong{background:#fce6e6;border-color:#c75f5f}.feedback{min-height:47px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:650;color:var(--muted)}.feedback.ok{color:var(--accent)}.feedback.bad{color:var(--red)}.wordprompt{text-align:center;padding:15px 6px}.answerbox{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;min-height:66px;padding:12px 5px;background:#f5f8f6;border:1px solid var(--line);border-radius:15px;margin:10px 0 18px;align-items:center}.slot{display:flex;align-items:center;justify-content:center;width:clamp(20px,6.4vw,34px);height:37px;border-bottom:2px solid #8bb3a7;font-weight:750;font-size:20px}.slot.filled{background:white;border-radius:7px}.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 16px}.letter{width:43px;height:48px;border-radius:11px;background:white;border:1px solid #b9d1c9;box-shadow:0 2px 0 #b9d1c9;font-size:23px;font-weight:750}.letter.used{visibility:hidden}.smallbutton{background:transparent;color:var(--accent);font-weight:700;min-height:44px;padding:8px;font-size:14px}.stageintro{display:grid;gap:8px;margin:15px 0}.stageintro div{display:flex;align-items:center;gap:12px;background:#f4f8f6;border-radius:12px;padding:10px}.num{display:grid;place-items:center;border-radius:10px;background:#e1efe9;min-width:34px;height:34px;font-weight:800;color:var(--accent)}.complete{text-align:center}.checkmark{width:65px;height:65px;background:var(--soft);border-radius:50%;display:grid;place-items:center;font-size:35px;color:var(--accent);margin:5px auto 15px}.errorlist{text-align:left;font-size:14px;margin:15px 0;padding:12px 15px;background:#f5f8f6;border-radius:12px}.errorlist div{margin:4px 0}.footer{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}.notice{background:#fff4e3;color:#785323;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px} @media(max-width:360px){main{padding-left:10px;padding-right:10px}.panel{padding:15px}.letter{width:37px}.match{min-height:60px}}
</style></head>
<body><main><header><div><div class="eyebrow">Лексический минимум · § 30</div><div class="brand">Med<span>Latin</span></div></div><button class="homebtn" id="home" hidden>На главную</button></header><div id="app"></div><div class="footer">Медицинская латынь · три шага к запоминанию</div></main>
<script>
'use strict';
const raw={
'А':[
['ala','ae f','крыло'],['angulus','i m','угол'],['aorta','ae f','аорта'],['arcus','us m','дуга'],['arteria','ae f','артерия'],['brachium','i n','плечо'],['caput','itis n','голова; головка'],['cavitas','atis f','полость'],['concha','ae f','раковина'],['costa','ae f','ребро'],['cornu','us n','рог'],['corpus','oris n','тело'],['cranium','i n','череп'],['crista','ae f','гребень'],['ductus','us m','проток'],['incisura','ae f','вырезка'],['lamina','ae f','пластинка'],['ligamentum','i n','связка'],['linea','ae f','линия'],['lingua','ae f','язык'],['mandibula','ae f','нижняя челюсть'],['maxilla','ae f','верхняя челюсть'],['meatus','us m','проход, ход'],['musculus','i m','мышца'],['orbita','ae f','глазница'],['os','ossis n','кость'],['raphe','es f','шов (место сращения мягких тканей, сухожилий, мышц)'],['scapula','ae f','лопатка'],['septum','i n','перегородка'],['spina','ae f','ость'],['sulcus','i m','борозда'],['tympanum','i n','барабан'],['ulna','ae f','локтевая кость'],['vena','ae f','вена'],['vertebra','ae f','позвонок']],
'Б':[['calcaneus','i m','пяточная кость'],['crus','cruris n','ножка; голень'],['digitus','i m','палец'],['genu','us n','колено'],['humerus','i m','плечевая кость'],['manubrium','i n','рукоятка'],['patella','ae f','надколенник'],['radius','i m','лучевая кость'],['sternum','i n','грудина'],['sutura','ae f','шов (костный)'],['tuba','ae f','труба']],
'С':[['alveolus','i m','альвеола'],['bucca','ae f','щека'],['enamelum','i n','зубная эмаль'],['frenulum','i n','уздечка'],['gingiva','ae f','десна'],['jugum','i n','возвышение'],['labium','i n','губа'],['lingula','ae f','язычок'],['papilla','ae f','сосочек'],['protuberantia','ae f','выступ'],['pulpa','ae f','пульпа, мякоть']]};
const all=Object.entries(raw).flatMap(([group,items])=>items.map(([word,ending,ru],i)=>({id:group+i,group,word,ending,ru,full:word+', '+ending})));
const app=document.getElementById('app'),home=document.getElementById('home');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let section='А',size=5,groupIndex=0,deck=[],stage=0,index=0,flipped=false,seen=new Set(),matched=new Set(),selection={l:null,r:null},matchOrder=[],matchLeft=[],wrong=null,letters=[],picked=[],spellSolved=false,feedback='',feedbackType='',errors=new Set(),mistakes=0,storageOK=true,completed=new Set();
try{completed=new Set(JSON.parse(localStorage.getItem('medlatin-completed-v1')||'[]'));}catch(e){storageOK=false;}
const words=()=>section==='Все'?all:all.filter(w=>w.group===section);
const groups=()=>{const a=words(),r=[];for(let i=0;i<a.length;i+=size)r.push(a.slice(i,i+size));return r};
const keyFor=a=>a.map(w=>w.id).join('|');
function save(){try{localStorage.setItem('medlatin-completed-v1',JSON.stringify([...completed]))}catch(e){storageOK=false}}
function button(id,label,cls='primary',disabled=false){return `<button id="${id}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`}
function on(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn}
function renderHome(){stage=0;home.hidden=true;const gs=groups();groupIndex=Math.min(groupIndex,gs.length-1);app.innerHTML=`<section class="panel"><div class="eyebrow">Тренировка</div><h1>Латынь<br>по шагам</h1><p class="muted">57 терминов из учебника. Выбери раздел и порцию слов. Одни и те же слова пройдут через все три задания.</p><div class="section">${['А','Б','С','Все'].map(s=>`<button data-section="${s}" class="${section===s?'active':''}">${s}</button>`).join('')}</div><label for="size" class="field">Слов за один подход</label><select id="size">${[3,5,10].map(n=>`<option value="${n}" ${size===n?'selected':''}>${n} слов</option>`).join('')}</select><label for="group" class="field">Набор слов</label><select id="group">${gs.map((a,i)=>`<option value="${i}" ${groupIndex===i?'selected':''}>${i+1}. ${a[0].word} — ${a[a.length-1].word} (${a.length}) ${completed.has(keyFor(a))?'✓':''}</option>`).join('')}</select><div class="stageintro"><div><span class="num">1</span><span><b>Флеш-карточки</b><br><small class="muted">Вспомни перевод</small></span></div><div><span class="num">2</span><span><b>Найди пару</b><br><small class="muted">Слово и перевод</small></span></div><div><span class="num">3</span><span><b>Собери слово</b><br><small class="muted">Составь из букв</small></span></div></div>${button('start','Начать тренировку')}${!storageOK?'<p class="muted">В этом режиме браузера прогресс может не сохраняться.</p>':''}</section>`;
app.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;groupIndex=0;renderHome()});document.getElementById('size').onchange=e=>{size=+e.target.value;groupIndex=0;renderHome()};document.getElementById('group').onchange=e=>{groupIndex=+e.target.value};on('start',()=>start(groups()[groupIndex]));}
function start(a){deck=[...a];stage=1;index=0;seen=new Set();flipped=false;errors=new Set();mistakes=0;feedback='';feedbackType='';render()}
function steps(){return `<div class="steps">${['Карточки','Найди пару','Собери слово'].map((s,i)=>`<div class="step ${stage===i+1?'active':stage>i+1?'done':''}"><strong>${stage>i+1?'✓':i+1}</strong>${s}</div>`).join('')}</div>`}
function progress(n,total){return `<div class="between"><span class="muted">${n} из ${total}</span><span class="muted">${Math.round(n/total*100)}%</span></div><div class="bar"><div style="width:${n/total*100}%"></div></div>`}
function render(){home.hidden=false;if(stage===1)renderCards();else if(stage===2)renderMatch();else if(stage===3)renderSpell();else renderDone()}
function renderCards(){const w=deck[index];app.innerHTML=steps()+`<section class="panel"><h2>Флеш-карточки</h2><p class="muted">Вспомни перевод. Нажми на карточку, чтобы проверить себя.</p>${progress(seen.size,deck.length)}<div class="between"><span class="eyebrow">Карточка ${index+1} / ${deck.length}</span><span class="hint">Раздел ${w.group}</span></div><button id="flip" class="flash ${flipped?'flipped':''}" aria-label="Перевернуть карточку"><span class="eyebrow">${flipped?'Перевод':'Латинский термин'}</span><span class="term">${flipped?w.ru:w.word}</span><span class="subterm">${flipped?w.full:w.ending}</span><span class="hint">↻ Нажми, чтобы перевернуть</span></button><div class="row">${button('prev','← Назад','secondary',index===0)}${button('next','Далее →','secondary',index===deck.length-1||!seen.has(w.id))}</div><div style="height:12px"></div>${button('match','К этапу 2 →','primary',seen.size!==deck.length)}</section>`;
on('flip',()=>{flipped=!flipped;if(flipped)seen.add(w.id);renderCards()});on('prev',()=>{index--;flipped=false;renderCards()});on('next',()=>{index++;flipped=false;renderCards()});on('match',()=>{stage=2;matched=new Set();selection={l:null,r:null};matchLeft=shuffle(deck);matchOrder=shuffle(deck);wrong=null;feedback='';feedbackType='';render()});}
function renderMatch(){const tile=(w,side)=>{const done=matched.has(w.id),sel=selection[side]===w.id,bad=wrong&&wrong[side]===w.id;return `<button class="match ${done?'matched':sel?'selected':''} ${bad?'wrong':''}" data-side="${side}" data-id="${w.id}" ${done?'disabled':''}>${side==='l'?w.word:w.ru}${done?' ✓':''}</button>`};app.innerHTML=steps()+`<section class="panel"><h2>Найди пару</h2><p class="muted">Нажми на латинский термин и его перевод. Порядок выбора не важен.</p>${progress(matched.size,deck.length)}<div class="matchgrid"><div class="matchcol"><div class="matchhead">Латынь</div>${matchLeft.map(w=>tile(w,'l')).join('')}</div><div class="matchcol"><div class="matchhead">Перевод</div>${matchOrder.map(w=>tile(w,'r')).join('')}</div></div><div class="feedback ${feedbackType}" role="status">${feedback||'Выбери первую карточку'}</div>${button('spell','К этапу 3 →','primary',matched.size!==deck.length)}</section>`;
app.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>choosePair(b.dataset.side,b.dataset.id));on('spell',()=>{stage=3;index=0;prepareSpell();render()});}
function choosePair(side,id){wrong=null;selection[side]=selection[side]===id?null:id;feedback='';feedbackType='';if(selection.l&&selection.r){if(selection.l===selection.r){matched.add(selection.l);feedback=matched.size===deck.length?'Все пары найдены!':'Верно!';feedbackType='ok'}else{wrong={...selection};errors.add(selection.l);errors.add(selection.r);mistakes++;feedback='Не совпало. Попробуй ещё раз.';feedbackType='bad'}selection={l:null,r:null}}else if(selection.l||selection.r){feedback='Теперь выбери пару'}renderMatch()}
function prepareSpell(){const w=deck[index];letters=shuffle([...w.word].map((c,i)=>({c,i})));if(letters.map(x=>x.c).join('')===w.word&&new Set(w.word).size>1){const k=letters.findIndex(x=>x.c!==letters[0].c);[letters[0],letters[k]]=[letters[k],letters[0]]}picked=[];spellSolved=false;feedback='';feedbackType=''}
function renderSpell(){const w=deck[index],s=picked.map(i=>letters[i].c);app.innerHTML=steps()+`<section class="panel"><h2>Собери слово</h2><p class="muted">Нажимай на буквы по порядку. Нажатие на собранную букву убирает её и возвращает вниз.</p>${progress(index+(spellSolved?1:0),deck.length)}<div class="wordprompt"><div class="eyebrow">Перевод</div><div class="term">${w.ru}</div></div><div class="answerbox" aria-label="Собранное слово">${[...w.word].map((_,i)=>i<s.length?`<button class="slot filled" data-remove="${i}" ${spellSolved?'disabled':''}>${s[i]}</button>`:'<span class="slot">&nbsp;</span>').join('')}</div><div class="letters">${letters.map((a,i)=>`<button class="letter ${picked.includes(i)?'used':''}" data-letter="${i}" ${spellSolved||picked.includes(i)?'disabled':''}>${a.c}</button>`).join('')}</div><div class="row">${button('clear','Очистить','smallbutton',spellSolved||!picked.length)}${button('hint','Подсказка','smallbutton',spellSolved)}</div><div class="feedback ${feedbackType}" role="status">${feedback||'Составь латинское слово'}</div>${spellSolved?button('nextword',index===deck.length-1?'Завершить тренировку':'Следующее слово →'):button('check','Проверить','primary',picked.length!==w.word.length)}</section>`;
app.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{picked.push(+b.dataset.letter);feedback='';feedbackType='';renderSpell()});app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.remove,1);feedback='';feedbackType='';renderSpell()});on('clear',()=>{picked=[];feedback='';feedbackType='';renderSpell()});on('hint',()=>{feedback='Начинается на «'+w.word[0]+'». '+w.word.length+' букв.';feedbackType='';renderSpell()});on('check',()=>{if(picked.map(i=>letters[i].c).join('')===w.word){spellSolved=true;feedback='Правильно! '+w.full;feedbackType='ok'}else{mistakes++;errors.add(w.id);feedback='Пока неверно. Переставь буквы и проверь снова.';feedbackType='bad'}renderSpell()});on('nextword',()=>{if(index+1<deck.length){index++;prepareSpell();render()}else{completed.add(keyFor(deck));save();stage=4;render()}});}
function renderDone(){const err=deck.filter(w=>errors.has(w.id));app.innerHTML=steps()+`<section class="panel complete"><div class="checkmark">✓</div><h1>Все три этапа пройдены!</h1><p>Отработано слов: <b>${deck.length}</b></p><p class="muted">Неверных попыток: ${mistakes}</p>${err.length?`<div class="errorlist"><b>Стоит повторить:</b>${err.map(w=>`<div>${w.full} — ${w.ru}</div>`).join('')}</div>${button('retry','Повторить трудные слова','secondary')}<div style="height:10px"></div>`:''}${button('nextgroup',groupIndex+1<groups().length?'Следующий набор →':'Выбрать новый набор')}<div style="height:10px"></div>${button('again','Повторить этот набор','secondary')}</section>`;on('retry',()=>start(err));on('again',()=>start(deck));on('nextgroup',()=>{if(groupIndex+1<groups().length){groupIndex++;start(groups()[groupIndex])}else renderHome()})}
home.onclick=()=>{if(stage===4||confirm('Вернуться к выбору набора? Незавершённая тренировка не сохранится.'))renderHome()};renderHome();
</script></body></html>
